<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DORKMUX — ADMIN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#e53e3e;--red-dark:#9b2c2c;--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--border:rgba(255,255,255,0.06);--text:#e2e8f0;--text2:#718096}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}

/* Header */
.header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(10,10,10,0.98);position:sticky;top:0;z-index:50}
.header-logo{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--red);letter-spacing:3px}
.header-badge{background:rgba(229,62,62,0.1);border:1px solid rgba(229,62,62,0.2);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--red);letter-spacing:2px}
.header-right{margin-left:auto;display:flex;gap:8px}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all 0.2s}
.btn-chat{background:rgba(229,62,62,0.08);border:1px solid rgba(229,62,62,0.2);color:var(--red)}
.btn-logout{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text2)}

/* Content */
.content{max-width:600px;margin:0 auto;padding:20px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin-bottom:4px}
.stat-num.red{color:var(--red)}
.stat-num.green{color:#48bb78}
.stat-num.orange{color:#ed8936}
.stat-label{font-size:10px;color:var(--text2);letter-spacing:2px;text-transform:uppercase}

/* Card */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:12px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--red);border-radius:2px}

/* Form */
.field{margin-bottom:14px}
.label{display:block;font-size:11px;color:var(--text2);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
input,select{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:all 0.3s;-webkit-appearance:none}
input:focus,select:focus{border-color:rgba(229,62,62,0.3);background:rgba(229,62,62,0.02)}
input::placeholder{color:rgba(255,255,255,0.15)}
select option{background:#1a1a1a;color:#fff}

/* Buttons */
.btn{width:100%;background:linear-gradient(135deg,var(--red-dark),var(--red));border:none;border-radius:10px;padding:12px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;transition:all 0.2s;letter-spacing:1px}
.btn:active{transform:scale(0.98)}

/* Success */
.success{display:none;margin-top:10px;padding:10px 14px;background:rgba(72,187,120,0.06);border:1px solid rgba(72,187,120,0.15);border-radius:10px;color:#68d391;font-size:12px;text-align:center}

/* User list */
.user-item{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:border 0.2s}
.user-item:hover{border-color:rgba(229,62,62,0.15)}
.user-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.u-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.u-avatar.admin{background:linear-gradient(135deg,#744210,#d69e2e);color:#fff}
.u-avatar.user{background:linear-gradient(135deg,var(--red-dark),var(--red));color:#fff}
.u-info{flex:1}
.u-name{font-size:14px;font-weight:600;margin-bottom:2px}
.u-role{font-size:10px;letter-spacing:2px;text-transform:uppercase}
.u-role.admin{color:#d69e2e}
.u-role.user{color:var(--red)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{padding:3px 8px;border-radius:6px;font-size:10px;letter-spacing:1px}
.badge-active{background:rgba(72,187,120,0.1);border:1px solid rgba(72,187,120,0.2);color:#68d391}
.badge-expired{background:rgba(229,62,62,0.1);border:1px solid rgba(229,62,62,0.2);color:#fc8181}
.u-detail{font-size:11px;color:var(--text2);line-height:1.8;margin-bottom:10px}
.u-actions{display:flex;gap:6px}
.action-btn{padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all 0.2s;font-weight:500}
.btn-extend{background:rgba(72,187,120,0.08);border:1px solid rgba(72,187,120,0.2);color:#68d391}
.btn-delete{background:rgba(229,62,62,0.08);border:1px solid rgba(229,62,62,0.2);color:#fc8181}
.btn-extend:active,.btn-delete:active{transform:scale(0.95)}

/* Empty */
.empty{text-align:center;padding:30px;color:var(--text2);font-size:13px}

/* Search */
.search-wrap{position:relative;margin-bottom:14px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2)}
.search-input{padding-left:36px!important}
</style>
</head>
<body>

<div class="header">
    <span class="header-logo">DORKMUX</span>
    <span class="header-badge">ADMIN</span>
    <div class="header-right">
        <button class="btn-sm btn-chat" onclick="window.location.href='chat.html'">Chat</button>
        <button class="btn-sm btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<div class="content">
    <div class="stats">
        <div class="stat">
            <div class="stat-num red" id="totalUsers">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat">
            <div class="stat-num green" id="activeUsers">0</div>
            <div class="stat-label">Active</div>
        </div>
        <div class="stat">
            <div class="stat-num orange" id="expiredUsers">0</div>
            <div class="stat-label">Expired</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Create Account</div>
        <div class="field">
            <label class="label">Username</label>
            <input type="text" id="newUser" placeholder="Enter username...">
        </div>
        <div class="field">
            <label class="label">Password</label>
            <input type="text" id="newPass" placeholder="Enter password...">
        </div>
        <div class="field">
            <label class="label">Duration</label>
            <select id="newDuration">
                <option value="7">7 Days</option>
                <option value="30" selected>30 Days</option>
                <option value="90">90 Days</option>
                <option value="180">180 Days</option>
                <option value="365">1 Year</option>
                <option value="9999">Lifetime</option>
            </select>
        </div>
        <button class="btn" onclick="createAccount()">CREATE ACCOUNT</button>
        <div class="success" id="successMsg">Account created successfully!</div>
    </div>

    <div class="card">
        <div class="card-title">User Management</div>
        <div class="search-wrap">
            <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input class="search-input" type="text" id="searchInput" placeholder="Search user..." oninput="filterUsers()">
        </div>
        <div id="userList"></div>
    </div>
</div>

<script>
const session = JSON.parse(sessionStorage.getItem('dorkmux_v2_user') || '{}');
if (!session.username || session.role !== 'admin') window.location.href = 'login.html';

let accounts = [];
let filtered = [];

async function init() {
    const saved = localStorage.getItem('dorkmux_v2_accounts');
    if (saved) {
        accounts = JSON.parse(saved);
    } else {
        try {
            const res = await fetch('accounts.json');
            const data = await res.json();
            accounts = data.accounts;
            save();
        } catch(e) { accounts = []; }
    }
    filtered = [...accounts];
    render();
    updateStats();
}

function save() {
    localStorage.setItem('dorkmux_v2_accounts', JSON.stringify(accounts));
}

function updateStats() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('totalUsers').textContent = accounts.length;
    document.getElementById('activeUsers').textContent = accounts.filter(a => a.expired >= today).length;
    document.getElementById('expiredUsers').textContent = accounts.filter(a => a.expired < today).length;
}

function filterUsers() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filtered = accounts.filter(a => a.username.toLowerCase().includes(q));
    render();
}

function render() {
    const list = document.getElementById('userList');
    const today = new Date().toISOString().split('T')[0];

    if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">No users found</div>';
        return;
    }

    list.innerHTML = filtered.map((acc, i) => {
        const realIdx = accounts.indexOf(acc);
        const isActive = acc.expired >= today;
        const isAdmin = acc.role === 'admin';
        return `
            <div class="user-item">
                <div class="user-top">
                    <div class="u-avatar ${isAdmin ? 'admin' : 'user'}">${acc.username[0].toUpperCase()}</div>
                    <div class="u-info">
                        <div class="u-name">${acc.username}</div>
                        <div class="u-role ${isAdmin ? 'admin' : 'user'}">${isAdmin ? 'ADMINISTRATOR' : 'MEMBER'}</div>
                    </div>
                </div>
                <div class="badges">
                    <span class="badge ${isActive ? 'badge-active' : 'badge-expired'}">${isActive ? 'ACTIVE' : 'EXPIRED'}</span>
                </div>
                <div class="u-detail">
                    Password: ${acc.password}<br>
                    Expired: ${acc.expired}
                </div>
                ${!isAdmin ? `
                <div class="u-actions">
                    <button class="action-btn btn-extend" onclick="extend(${realIdx})">+30 Days</button>
                    <button class="action-btn btn-delete" onclick="del(${realIdx})">Delete</button>
                </div>` : ''}
            </div>
        `;
    }).join('');
}

function createAccount() {
    const u = document.getElementById('newUser').value.trim();
    const p = document.getElementById('newPass').value.trim();
    const d = parseInt(document.getElementById('newDuration').value);

    if (!u || !p) { alert('Fill all fields!'); return; }
    if (accounts.find(a => a.username === u)) { alert('Username already exists!'); return; }

    const exp = new Date();
    exp.setDate(exp.getDate() + d);

    accounts.push({
        username: u,
        password: p,
        role: 'user',
        expired: exp.toISOString().split('T')[0]
    });

    save();
    filtered = [...accounts];
    render();
    updateStats();

    document.getElementById('newUser').value = '';
    document.getElementById('newPass').value = '';

    const msg = document.getElementById('successMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
}

function extend(i) {
    const exp = new Date(accounts[i].expired);
    const today = new Date();
    if (exp < today) exp.setTime(today.getTime());
    exp.setDate(exp.getDate() + 30);
    accounts[i].expired = exp.toISOString().split('T')[0];
    save();
    filtered = [...accounts];
    render();
    updateStats();
}

function del(i) {
    if (!confirm(`Delete ${accounts[i].username}?`)) return;
    accounts.splice(i, 1);
    save();
    filtered = [...accounts];
    render();
    updateStats();
}

function logout() {
    sessionStorage.removeItem('dorkmux_v2_user');
    window.location.href = 'login.html';
}

init();
</script>
</body>
</html>
