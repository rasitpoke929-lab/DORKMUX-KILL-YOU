<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>DORKMUX AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#e53e3e;--red-dark:#9b2c2c;--red-glow:rgba(229,62,62,0.15);--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--border:rgba(229,62,62,0.15);--text:#e2e8f0;--text2:#718096}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:50px 50px;animation:gridScroll 30s linear infinite}
@keyframes gridScroll{0%{transform:translateY(0)}100%{transform:translateY(50px)}}
.orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
.orb1{width:400px;height:400px;background:rgba(229,62,62,0.06);top:-100px;right:-100px;animation:float 10s ease-in-out infinite}
.orb2{width:300px;height:300px;background:rgba(229,62,62,0.04);bottom:-100px;left:-100px;animation:float 12s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,30px)}}
.scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px);pointer-events:none;z-index:1}
.wrap{position:relative;z-index:10;width:92%;max-width:420px}
.card{background:rgba(10,10,10,0.95);border:1px solid var(--border);border-radius:24px;padding:40px 32px;backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(229,62,62,0.05),0 25px 80px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.02)}
.card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);border-radius:1px}
.logo-area{text-align:center;margin-bottom:32px}
.logo{width:90px;height:90px;object-fit:contain;border-radius:16px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(229,62,62,0.4));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(229,62,62,0.3))}50%{filter:drop-shadow(0 0 30px rgba(229,62,62,0.7))}}
.brand{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;letter-spacing:6px;background:linear-gradient(135deg,#fff 0%,var(--red) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:10px;color:rgba(229,62,62,0.4);letter-spacing:4px;margin-top:4px;text-transform:uppercase}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider-line{flex:1;height:1px;background:var(--border)}
.divider-txt{font-size:10px;color:rgba(229,62,62,0.3);letter-spacing:3px;white-space:nowrap}
.field{margin-bottom:16px}
.label{display:block;font-size:11px;color:rgba(229,62,62,0.5);letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}
.input-wrap{position:relative}
.ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(229,62,62,0.4)}
input{width:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(229,62,62,0.12);border-radius:12px;padding:13px 14px 13px 42px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:all 0.3s}
input:focus{border-color:rgba(229,62,62,0.4);background:rgba(229,62,62,0.03);box-shadow:0 0 0 3px rgba(229,62,62,0.06)}
input::placeholder{color:rgba(255,255,255,0.15)}
.btn{width:100%;background:linear-gradient(135deg,var(--red-dark),var(--red));border:none;border-radius:12px;padding:14px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;letter-spacing:2px;cursor:pointer;margin-top:8px;transition:all 0.3s;box-shadow:0 4px 20px rgba(229,62,62,0.2);position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,0.08),transparent);transform:translateX(-100%);transition:transform 0.5s}
.btn:hover::after{transform:translateX(100%)}
.btn:active{transform:scale(0.98)}
.err{display:none;margin-top:14px;padding:10px 14px;background:rgba(229,62,62,0.06);border:1px solid rgba(229,62,62,0.15);border-radius:10px;color:#fc8181;font-size:12px;text-align:center;letter-spacing:1px}
.footer{margin-top:28px;padding-top:20px;border-top:1px solid rgba(229,62,62,0.06);text-align:center}
.footer p{font-size:11px;color:var(--text2);margin-bottom:10px}
.order-link{color:var(--red);font-size:12px;text-decoration:none;letter-spacing:1px;padding:7px 18px;border:1px solid rgba(229,62,62,0.2);border-radius:20px;transition:all 0.3s;display:inline-block}
.order-link:hover{background:rgba(229,62,62,0.08);border-color:var(--red)}
.ver{margin-top:16px;font-size:9px;color:rgba(255,255,255,0.06);letter-spacing:3px}
canvas{position:fixed;inset:0;z-index:0;opacity:0.06}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bg"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="scanline"></div>
<div class="wrap">
<div class="card">
<div class="logo-area">
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<div class="brand">DORK<span style="color:var(--red)">MUX</span></div>
<div class="brand-sub">Dark Intelligence System</div>
</div>
<div class="divider"><div class="divider-line"></div><div class="divider-txt">SECURE ACCESS</div><div class="divider-line"></div></div>
<div class="field">
<label class="label">Identifier</label>
<div class="input-wrap">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
<input type="text" id="u" placeholder="Username..." autocomplete="off">
</div>
</div>
<div class="field">
<label class="label">Auth Key</label>
<div class="input-wrap">
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
<input type="password" id="p" placeholder="Password..." onkeypress="if(event.key==='Enter')login()">
</div>
</div>
<button class="btn" onclick="login()">INITIALIZE ACCESS</button>
<div class="err" id="err"></div>
<div class="footer">
<p>No account? Purchase access from admin</p>
<a href="https://t.me/dorkmux666" class="order-link">BUY ACCESS &rarr;</a>
<div class="ver">DORKMUX AI v4.0 — 2026</div>
</div>
</div>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=window.innerWidth;c.height=window.innerHeight;
const ch='DORKMUX01ABCDEF';
const fs=12;const cols=Math.floor(c.width/fs);
const dr=Array(cols).fill(1);
function draw(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='rgba(229,62,62,0.5)';ctx.font=fs+'px monospace';dr.forEach((y,i)=>{const ch2=ch[Math.floor(Math.random()*ch.length)];ctx.fillText(ch2,i*fs,y*fs);if(y*fs>c.height&&Math.random()>.975)dr[i]=0;dr[i]++;})}
setInterval(draw,60);

async function login(){
const u=document.getElementById('u').value.trim();
const p=document.getElementById('p').value.trim();
const err=document.getElementById('err');
if(!u||!p){err.textContent='FIELD CANNOT BE EMPTY';err.style.display='block';return}
try{
const saved=localStorage.getItem('dorkmux_v2_accounts');
let accounts=saved?JSON.parse(saved):null;
if(!accounts){const res=await fetch('accounts.json');const data=await res.json();accounts=data.accounts;localStorage.setItem('dorkmux_v2_accounts',JSON.stringify(accounts));}
const acc=accounts.find(a=>a.username===u&&a.password===p);
if(acc){
const today=new Date().toISOString().split('T')[0];
if(acc.expired<today){err.textContent='ACCESS EXPIRED — CONTACT ADMIN';err.style.display='block';return}
sessionStorage.setItem('dorkmux_v2_user',JSON.stringify(acc));
window.location.href=acc.role==='admin'?'admin.html':'chat.html';
}else{err.textContent='INVALID CREDENTIALS — ACCESS DENIED';err.style.display='block';setTimeout(()=>err.style.display='none',3000)}
}catch(e){err.textContent='SYSTEM ERROR: '+e.message;err.style.display='block'}
}
</script>
</body>
</html>
